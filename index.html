<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Osobný diár</title>
<meta name="theme-color" content="#2547c4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diár">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky toolbar, one working surface below that switches between month grid, week columns and a three-column board */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --ink: #16202c;
  --muted: #5b6878;
  --line: #d9e0e8;
  --accent: #2547c4;
  --accent-soft: #e3e9fb;
  --on-accent: #ffffff;
  --todo: #64748b;
  --doing: #b86e00;
  --done: #2b8553;
  --danger: #c2341f;
  --shadow: 0 10px 30px rgba(20, 32, 60, .14);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319; --surface: #161d26; --surface-2: #1b2430; --ink: #e5eaf0; --muted: #94a2b2;
    --line: #283340; --accent: #86a0ff; --accent-soft: #1f2a4a; --on-accent: #0e1319;
    --todo: #94a3b8; --doing: #f0a63a; --done: #5cc58a; --danger: #ff7a66;
    --shadow: 0 12px 34px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #161d26; --surface-2: #1b2430; --ink: #e5eaf0; --muted: #94a2b2;
  --line: #283340; --accent: #86a0ff; --accent-soft: #1f2a4a; --on-accent: #0e1319;
  --todo: #94a3b8; --doing: #f0a63a; --done: #5cc58a; --danger: #ff7a66;
  --shadow: 0 12px 34px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body { margin: 0; }
.gate { max-width: 440px; margin: 40px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.gate h2 { font-family: var(--f-display); margin: 0; font-size: 1.5rem; }
.gate p { margin: 0; color: var(--muted); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 12px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; letter-spacing: -.01em; margin: 0; margin-right: auto; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); font-weight: 500; letter-spacing: .04em; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: .88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.primary { border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; padding: 8px 14px; border-radius: 10px; }
.ghost { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 10px; font-weight: 500; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; display: inline-grid; place-items: center; font-size: 1.1rem; line-height: 1; }

.nav { display: flex; align-items: center; gap: 8px; padding-block: 18px 12px; flex-wrap: wrap; }
.period { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; letter-spacing: -.015em; margin: 0 auto 0 4px; text-wrap: balance; }
.period span { color: var(--muted); font-weight: 500; }

.notice { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: .9rem; }

/* Month */
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px; }
.dow div { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding-left: 8px; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cell { min-width: 0; min-height: 104px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.cell.out { background: transparent; border-style: dashed; }
.cell.out .num { color: var(--muted); opacity: .7; }
.cell.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.num { font-family: var(--f-mono); font-size: .8rem; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.cell.today .num { background: var(--accent); color: var(--on-accent); }
.chip { display: block; min-width: 0; font-size: .76rem; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); border-left: 3px solid var(--todo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip[data-s="doing"] { border-left-color: var(--doing); }
.chip[data-s="done"] { border-left-color: var(--done); color: var(--muted); text-decoration: line-through; }
.chip b { font-family: var(--f-mono); font-weight: 500; font-size: .7rem; color: var(--muted); margin-right: 4px; }
.more { font-size: .72rem; color: var(--muted); padding-left: 4px; }
.dots { display: none; gap: 3px; flex-wrap: wrap; padding-left: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--todo); }
.dots i[data-s="doing"] { background: var(--doing); }
.dots i[data-s="done"] { background: var(--done); }

.agenda { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.agenda-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.agenda-head h2 { font-family: var(--f-display); font-size: 1.15rem; margin: 0 auto 0 0; }

/* Cards */
.list { display: flex; flex-direction: column; gap: 8px; }
.card { min-width: 0; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; }
.card:hover { border-color: var(--accent); }
.card .t { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); padding-top: 2px; min-width: 42px; }
.card .ttl { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.card .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .78rem; color: var(--muted); }
.card[data-s="done"] .ttl { text-decoration: line-through; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 600; letter-spacing: .02em; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill[data-s="todo"] { color: var(--todo); }
.pill[data-s="doing"] { color: var(--doing); }
.pill[data-s="done"] { color: var(--done); }
.prog { font-family: var(--f-mono); }
.empty { color: var(--muted); font-size: .9rem; padding: 10px 2px; }

/* Week */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wday { min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 260px; }
.wday.today { border-color: var(--accent); }
.wday-h { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.wday-h strong { font-family: var(--f-display); font-size: 1rem; }
.wday-h span { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.wday.today .wday-h span { color: var(--accent); }
.add-mini { border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 4px; font-size: .8rem; margin-top: auto; }
.add-mini:hover { color: var(--accent); border-color: var(--accent); }
.week .card { grid-template-columns: 1fr; padding: 8px 10px; }
.week .card .t { min-width: 0; }
.week .card .meta { grid-column: 1; }

/* Board */
.board-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
.col { min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 200px; border-top: 4px solid var(--todo); }
.col[data-s="doing"] { border-top-color: var(--doing); }
.col[data-s="done"] { border-top-color: var(--done); }
.col.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
.col-h { display: flex; align-items: baseline; justify-content: space-between; padding: 2px 4px 4px; }
.col-h h3 { margin: 0; font-family: var(--f-display); font-size: 1.05rem; }
.col-h span { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.board .card { cursor: grab; }
.board .card.dragging { opacity: .45; }
.move { display: inline-flex; gap: 4px; margin-left: auto; }
.move button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-size: .75rem; padding: 0 6px; line-height: 1.6; }

/* Modal */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(10, 15, 25, .45); display: grid; place-items: center; padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.modal { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal h2 { margin: 0; font-family: var(--f-display); font-size: 1.3rem; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 9px 10px; min-width: 0; }
.field textarea { min-height: 90px; resize: vertical; }
.row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
.pay-box { display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 4px; }
.pay-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.money-in { display: flex; align-items: center; gap: 6px; }
.money-in input { flex: 1; min-width: 0; }
.per { color: var(--muted); font-size: .8rem; white-space: nowrap; }
.pay-out { font-size: .9rem; font-variant-numeric: tabular-nums; }
.pay-out strong { font-family: var(--f-display); font-size: 1.05rem; }
.new-wp { margin-top: 4px; }
.wp-form { display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); border: 1px dashed var(--accent); border-radius: 10px; padding: 10px; }
.wp-form input, .wp-form select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 10px; min-width: 0; }
.wp-rate { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wp-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.wp-tag { color: var(--accent); font-weight: 600; }
.pay-sum { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.pay-total { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
.pay-total strong { font-family: var(--f-display); font-size: 2.2rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.warn { margin: 0; padding: 8px 12px; border-radius: 9px; background: var(--surface); border: 1px solid var(--doing); color: var(--ink); font-size: .88rem; }
.sec { font-family: var(--f-display); font-size: 1.05rem; margin: 18px 0 8px; }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tfoot td { border-top: 2px solid var(--line); border-bottom: 0; font-weight: 700; }
.tbl .n { text-align: right; white-space: nowrap; }
.tbl .mono { font-family: var(--f-mono); font-size: .76rem; white-space: nowrap; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl .pill { margin-left: 6px; }
.wp-manage { display: flex; flex-direction: column; gap: 10px; }
.wp-list { display: flex; flex-direction: column; gap: 8px; }
.wp-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.wp-row.archived .wp-main strong { color: var(--muted); }
.wp-main { display: flex; flex-direction: column; min-width: 0; }
.wp-main strong { overflow-wrap: anywhere; }
@media (max-width: 620px) { .pay-grid { grid-template-columns: 1fr 1fr; } .pay-grid .field:first-child { grid-column: 1 / -1; } .wp-row { grid-template-columns: minmax(0, 1fr) auto; } .wp-row .wp-main { grid-column: 1 / -1; } }
.when { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.when .hint { grid-column: 1 / -1; }
.pair { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 6px; }
@media (max-width: 620px) { .when { grid-template-columns: minmax(0, 1fr); } }
.status-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.status-pick button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 5px 12px; font-size: .85rem; font-weight: 600; color: var(--muted); }
.status-pick button[aria-pressed="true"][data-s="todo"] { color: var(--todo); border-color: currentColor; background: var(--surface); }
.status-pick button[aria-pressed="true"][data-s="doing"] { color: var(--doing); border-color: currentColor; background: var(--surface); }
.status-pick button[aria-pressed="true"][data-s="done"] { color: var(--done); border-color: currentColor; background: var(--surface); }
.checks { display: flex; flex-direction: column; gap: 6px; }
.check { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.check input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.check input[type="text"] { border: 0; border-bottom: 1px solid transparent; background: transparent; padding: 4px 2px; min-width: 0; }
.check input[type="text"]:focus { border-bottom-color: var(--line); outline: none; }
.check.done input[type="text"] { text-decoration: line-through; color: var(--muted); }
.check .x { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; padding: 0 6px; }
.add-check { display: flex; gap: 8px; }
.add-check input { flex: 1; min-width: 0; border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 7px 10px; }
.modal-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 4px; }
.modal-foot .spacer { flex: 1; }
.danger { border: 1px solid var(--line); background: transparent; color: var(--danger); padding: 7px 12px; border-radius: 10px; font-weight: 500; }
.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.err { color: var(--danger); font-size: .85rem; }
.files { display: flex; flex-direction: column; gap: 6px; }
.file { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; }
.file .kind { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 6px; font-size: .78rem; font-weight: 600; }
.file .kind[data-k="faktura"] { color: var(--done); }
.file .kind[data-k="ponuka"] { color: var(--doing); }
.file .fname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .88rem; }
.file .fname small { color: var(--muted); font-family: var(--f-mono); font-size: .72rem; margin-left: 6px; }
.file .open { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 9px; font-size: .8rem; font-weight: 600; color: var(--accent); }
.file .x { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; padding: 0 4px; }
.file-add { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.file-add .hint { color: var(--muted); font-size: .8rem; }
.feed-lead { margin: 0; color: var(--muted); }
.feed-body { display: flex; flex-direction: column; gap: 12px; }
a.feed-add { display: block; text-align: center; text-decoration: none; padding: 11px 14px; }
.hint { margin: 0; color: var(--muted); font-size: .85rem; }
.hint a { color: var(--accent); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
.steps b { font-weight: 600; }
#feed-url { font-family: var(--f-mono); font-size: .75rem; }
@media (max-width: 620px) { .file { grid-template-columns: minmax(0, 1fr) auto auto; } .file .kind { grid-column: 1 / -1; justify-self: start; } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: .88rem; z-index: 30; box-shadow: var(--shadow); }

main { padding-bottom: 40px; }

@media (max-width: 900px) {
  .week { grid-template-columns: minmax(0, 1fr); }
  .wday { min-height: 0; }
  .board { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 620px) {
  .cell { min-height: 58px; padding: 4px; }
  .chip, .more { display: none; }
  .dots { display: flex; }
  .num { width: 24px; height: 24px; font-size: .74rem; }
  .dow { gap: 3px; } .month { gap: 3px; }
  .dow div { padding-left: 2px; font-size: .64rem; letter-spacing: .04em; }
  .period { font-size: 1.3rem; width: 100%; order: -1; margin: 0 0 4px; }
  .row { grid-template-columns: 1fr 1fr; }
  .row .field:first-child { grid-column: 1 / -1; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <h1 class="brand">Osobný diár <small id="sync">načítavam…</small></h1>
    <div class="seg" role="group" aria-label="Pohľad">
      <button id="v-month" data-v="month">Mesiac</button>
      <button id="v-week" data-v="week">Týždeň</button>
      <button id="v-board" data-v="board">Nástenka</button>
      <button id="v-pay" data-v="pay">Mzdy</button>
    </div>
    <button class="primary" id="new-btn">+ Nová akcia</button>
    <button class="ghost" id="cal-btn" hidden>Kalendár Apple</button>
    <button class="ghost" id="auth-btn" hidden>Odhlásiť</button>
  </div>
</header>

<main class="wrap">
  <div class="nav">
    <h2 class="period" id="period"></h2>
    <button class="icon-btn" id="prev" aria-label="Predchádzajúce">‹</button>
    <button class="ghost" id="today-btn">Dnes</button>
    <button class="icon-btn" id="next" aria-label="Nasledujúce">›</button>
  </div>
  <p class="notice" id="notice" hidden></p>
  <section id="view"></section>
</main>

<div id="modal-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  // ===== NASTAVENIE: sem vlož údaje zo Supabase (pozri NAVOD.md, krok 3) =====
  const SUPABASE_URL = "https://mtifpeafpmkeimqiqfym.supabase.co";
  const SUPABASE_KEY = "sb_publishable_sUqoAz8t_mJuAd4VR9Fw7Q_HlGTDAqg";
  const FEED_FUNCTION = "swift-service"; // názov Edge Function s kalendárom (Supabase → Edge Functions)
  // ===========================================================================

  const MONTHS = ["január","február","marec","apríl","máj","jún","júl","august","september","október","november","december"];
  const MONTHS_GEN = ["januára","februára","marca","apríla","mája","júna","júla","augusta","septembra","októbra","novembra","decembra"];
  const DOW = ["Po","Ut","St","Št","Pi","So","Ne"];
  const DOW_LONG = ["pondelok","utorok","streda","štvrtok","piatok","sobota","nedeľa"];
  const STATUS = { todo: "Naplánované", doing: "Prebieha", done: "Hotovo" };
  const ORDER = ["todo", "doing", "done"];

  const pad = n => String(n).padStart(2, "0");
  const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
  const todayIso = () => iso(new Date());
  const dowIdx = d => (d.getDay() + 6) % 7;
  const fmtDay = s => { const d = parse(s); return DOW_LONG[dowIdx(d)] + " " + d.getDate() + ". " + MONTHS_GEN[d.getMonth()]; };
  const fmtShort = s => { const d = parse(s); return d.getDate() + ". " + (d.getMonth() + 1) + "."; };

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "dataset") Object.assign(el.dataset, v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
    return el;
  }

  // ---------- State ----------
  const state = {
    view: "month",
    cursor: new Date(),
    selected: todayIso(),
    boardScope: "upcoming",
    payScope: "all",
    workplaces: new Map(),
    events: new Map(),
  };
  try { const v = localStorage.getItem("diar.view"); if (v) state.view = v; } catch (e) {}
  const hashMap = { mesiac: "month", tyzden: "week", nastenka: "board", mzdy: "pay" };
  if (hashMap[location.hash.slice(1)]) state.view = hashMap[location.hash.slice(1)];

  let sb = null;         // Supabase client
  let uid = null;        // signed-in user id
  let readOnly = false;
  let localMode = false; // no Supabase: keep events in this browser only
  state.gate = false;
  function saveLocalWp() {
    if (!localMode) return;
    try { localStorage.setItem("diar.workplaces", JSON.stringify([...state.workplaces.values()])); } catch (e) {}
  }
  function saveLocal() {
    if (!localMode) return;
    try { localStorage.setItem("diar.events", JSON.stringify([...state.events.values()])); } catch (e) {}
  }

  function sortEvents(list) {
    return list.sort((a, b) => (a.date + (a.time || "99")).localeCompare(b.date + (b.time || "99")) || a.title.localeCompare(b.title));
  }
  const lastDay = e => e.endDate || e.date;
  const isMulti = e => !!e.endDate && e.endDate !== e.date;
  function eventsOn(dateStr) {
    // events running on this day; ones that started earlier come first
    return [...state.events.values()].filter(e => e.date <= dateStr && lastDay(e) >= dateStr).sort((a, b) => {
      const ka = (a.date < dateStr ? "0" : "1") + (a.date < dateStr ? "" : (a.time || "99"));
      const kb = (b.date < dateStr ? "0" : "1") + (b.date < dateStr ? "" : (b.time || "99"));
      return ka.localeCompare(kb) || a.title.localeCompare(b.title);
    });
  }
  // what to show as the time of an event on a given day
  function dayLabel(ev, ds) {
    if (!isMulti(ev)) return ev.time ? ev.time + (ev.end ? "–" + ev.end : "") : "celý deň";
    if (ds === ev.date) return (ev.time ? ev.time + " " : "") + "→ " + fmtShort(ev.endDate);
    if (ds === ev.endDate) return "do " + (ev.end || "konca dňa");
    return "celý deň ↔";
  }
  function chipLabel(ev, ds) {
    if (!isMulti(ev)) return ev.time || "";
    if (ds === ev.date) return (ev.time || "") + "→";
    if (ds === ev.endDate) return "→" + (ev.end || "");
    return "↔";
  }
  function rangeText(ev) {
    const a = fmtShort(ev.date) + (ev.time ? " " + ev.time : "");
    if (!isMulti(ev)) return a + (ev.end ? "–" + ev.end : "");
    return a + " – " + fmtShort(ev.endDate) + (ev.end ? " " + ev.end : "");
  }

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
  }

  // ---------- Storage ----------
  function clean(ev) {
    return {
      title: ev.title, date: ev.date, time: ev.time || "", end: ev.end || "",
      endDate: ev.endDate && ev.endDate !== ev.date ? ev.endDate : "",
      work: ev.work && ev.work.type ? {
        wp: ev.work.wp || "", name: ev.work.name || "", type: ev.work.type,
        rate: ev.work.rate === null || ev.work.rate === undefined || ev.work.rate === "" ? null : Number(ev.work.rate), qty: ev.work.qty === null || ev.work.qty === "" || ev.work.qty === undefined ? null : Number(ev.work.qty),
      } : null,
      status: ev.status, notes: ev.notes || "",
      checklist: (ev.checklist || []).filter(c => c.text.trim()).map(c => ({ id: c.id, text: c.text.trim(), done: !!c.done })),
      attachments: (ev.attachments || []).map(a => ({ path: a.path, name: a.name, size: a.size || 0, kind: a.kind || "ine", added: a.added || Date.now() })),
      updated: Date.now(),
    };
  }
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() :
    "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
  const toRow = (id, d, withFiles, withEnd) => {
    const r = {
      id, title: d.title, event_date: d.date, start_time: d.time || null, end_time: d.end || null,
      status: d.status, notes: d.notes, checklist: d.checklist,
    };
    // end date only when used, so single-day events save even before the multi-day SQL is run
    if (withEnd || d.endDate) r.end_date = d.endDate || null;
    if (d.work || d._hadWork) r.work = d.work || null;
    // send attachments only when there are some (or they changed), so the diary keeps working before the attachments SQL is run
    if (withFiles || (d.attachments && d.attachments.length)) r.attachments = d.attachments || [];
    return r;
  };
  const fromRow = r => ({
    id: r.id, title: r.title, date: r.event_date, time: (r.start_time || "").slice(0, 5), end: (r.end_time || "").slice(0, 5),
    status: r.status || "todo", notes: r.notes || "", checklist: Array.isArray(r.checklist) ? r.checklist : [],
    attachments: Array.isArray(r.attachments) ? r.attachments : [],
    endDate: r.end_date && r.end_date !== r.event_date ? r.end_date : "",
    work: r.work && r.work.type ? r.work : null,
  });

  // ---------- Workplaces & pay ----------
  const RATE = {
    hour: { label: "Hodinová", unit: "hod", per: "€ / hod", qtyLabel: "Hodiny" },
    day:  { label: "Denná",    unit: "dní", per: "€ / deň", qtyLabel: "Dni" },
    task: { label: "Úkolová",  unit: "ks",  per: "€", qtyLabel: "Počet úloh" },
  };
  const moneyFmt = new Intl.NumberFormat("sk-SK", { style: "currency", currency: "EUR" });
  const numFmt = new Intl.NumberFormat("sk-SK", { maximumFractionDigits: 2 });
  const money = n => moneyFmt.format(n || 0);
  const num = n => numFmt.format(n || 0);
  const toNum = v => { const x = parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return isFinite(x) ? x : null; };
  let wpMissing = false;
  const activeWps = () => [...state.workplaces.values()].filter(w => !w.archived).sort((a, b) => a.name.localeCompare(b.name, "sk"));
  // quantity that follows from the event's own dates and times
  function autoQty(ev, type) {
    if (type === "day") return Math.round((parse(lastDay(ev)) - parse(ev.date)) / 864e5) + 1;
    if (type === "task") return 1;
    if (ev.time && ev.end) {
      let hrs = (new Date(lastDay(ev) + "T" + ev.end) - new Date(ev.date + "T" + ev.time)) / 36e5;
      if (hrs <= 0) hrs += 24;
      return Math.round(hrs * 100) / 100;
    }
    return null;
  }
  function payOf(ev) {
    const w = ev.work;
    if (!w || !RATE[w.type]) return null;
    const auto = autoQty(ev, w.type);
    const qty = w.type === "task" ? 1 : (w.qty !== null && w.qty !== undefined && w.qty !== "" ? Number(w.qty) : auto);
    const rate = w.rate === null || w.rate === undefined || w.rate === "" ? null : Number(w.rate);
    return { qty, auto, rate, unit: RATE[w.type].unit, amount: qty == null || rate == null ? null : Math.round(qty * rate * 100) / 100 };
  }
  async function saveWorkplace(w) {
    // rate 0 = not agreed yet (entered on each event instead)
    const row = { id: w.id || newId(), name: w.name.trim(), rate_type: w.rate_type, rate: Number(w.rate) || 0, note: w.note || "", archived: !!w.archived };
    if (!sb || !uid) { state.workplaces.set(row.id, row); saveLocalWp(); return row; }
    const { error } = await sb.from("workplaces").upsert(row);
    if (error) throw friendly(error);
    wpMissing = false;
    state.workplaces.set(row.id, row);
    return row;
  }
  function wpForm(initial, onDone, onCancel) {
    const w = initial ? { ...initial } : { name: "", rate_type: "hour", rate: "" };
    const key = (w.id || "new").slice(0, 8);
    const name = h("input", { id: "wp-name-" + key, type: "text", value: w.name, placeholder: "Názov odberateľa, napr. Stavby Novák s.r.o.", maxlength: "120", "aria-label": "Názov pracovného miesta" });
    const type = h("select", { id: "wp-type-" + key, "aria-label": "Druh sadzby" }, Object.keys(RATE).map(k => h("option", { value: k, text: RATE[k].label + " sadzba" })));
    type.value = w.rate_type;
    const rate = h("input", { id: "wp-rate-" + key, type: "text", inputmode: "decimal", value: Number(w.rate) > 0 ? Number(w.rate).toFixed(2).replace(".", ",") : "", "aria-label": "Sadzba v eurách" });
    const per = h("span", { class: "per" });
    const rateHint = h("p", { class: "hint" });
    function drawType() {
      const task = type.value === "task";
      per.textContent = task ? "€ / úlohu" : RATE[type.value].per;
      rate.placeholder = task ? "nepovinné" : "nepovinné, napr. 15,00";
      rateHint.textContent = task
        ? "Pri úkolovej sadzbe zadáš sumu pri každej akcii zvlášť. Sem môžeš dať obvyklú sumu, ktorá sa predvyplní."
        : "Sadzbu môžeš nechať prázdnu a doplniť neskôr.";
    }
    type.addEventListener("change", drawType); drawType();
    const err = h("p", { class: "err", hidden: true });
    const save = h("button", { class: "primary", type: "button", text: initial ? "Uložiť" : "Pridať pracovné miesto" });
    save.addEventListener("click", async () => {
      const r = rate.value.trim() === "" ? 0 : toNum(rate.value);
      if (!name.value.trim()) { err.textContent = "Zadaj názov pracovného miesta."; err.hidden = false; name.focus(); return; }
      if (r === null || r < 0) { err.textContent = "Sadzbu zadaj ako číslo, napr. 12,50, alebo ju nechaj prázdnu."; err.hidden = false; rate.focus(); return; }
      save.disabled = true;
      try { const row = await saveWorkplace({ ...w, name: name.value, rate_type: type.value, rate: r }); onDone(row); }
      catch (msg) { err.textContent = msg; err.hidden = false; save.disabled = false; }
    });
    const box = h("div", { class: "wp-form" },
      name,
      h("div", { class: "wp-rate" }, type, h("div", { class: "money-in" }, rate, per)),
      rateHint, err,
      h("div", { class: "wp-actions" }, onCancel ? h("button", { class: "ghost", type: "button", onclick: onCancel, text: "Zrušiť" }) : null, save),
    );
    setTimeout(() => { if (!initial) name.focus(); }, 30);
    return box;
  }

  // ---------- Attachments (Supabase Storage) ----------
  const BUCKET = "prilohy";
  const KINDS = { ponuka: "Cenová ponuka", faktura: "Faktúra", ine: "Iné" };
  const MAX_MB = 20;
  const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1024)) + " kB";
  const guessKind = n => /fakt|invoice|fa[_ -]?\d/i.test(n) ? "faktura" : /ponuk|cenov|offer|quot|nabid/i.test(n) ? "ponuka" : "ine";
  function storageMsg(e) {
    const m = ((e && (e.message || e.error)) || "") + "";
    if (/bucket not found/i.test(m)) return "Úložisko na prílohy ešte neexistuje. V Supabase spusti súbor supabase-prilohy.sql (pozri README).";
    if (/row-level|security|unauthori[sz]ed|403/i.test(m)) return "Úložisko súbor odmietlo. V Supabase spusti súbor supabase-prilohy.sql (pozri README).";
    if (/mime|type/i.test(m)) return "Dá sa priložiť iba PDF súbor.";
    if (/size|large|exceed|413/i.test(m)) return "Súbor je príliš veľký (max " + MAX_MB + " MB).";
    if (/fetch|network/i.test(m)) return "Si offline. Súbor sa nepodarilo nahrať.";
    return "Súbor sa nepodarilo nahrať: " + (m || "neznáma chyba");
  }
  async function uploadPdf(evId, file) {
    if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) throw "Dá sa priložiť iba PDF súbor.";
    if (file.size > MAX_MB * 1048576) throw "Súbor „" + file.name + "“ má viac ako " + MAX_MB + " MB.";
    const safe = (file.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_").slice(-80)) || "subor.pdf";
    const path = uid + "/" + evId + "/" + Date.now() + "-" + safe;
    const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: "application/pdf", upsert: false });
    if (error) throw storageMsg(error);
    return { path, name: file.name, size: file.size, kind: guessKind(file.name), added: Date.now() };
  }
  async function removeFiles(paths) {
    if (!sb || !paths.length) return;
    try { await sb.storage.from(BUCKET).remove(paths); } catch (e) {}
  }
  async function openFile(a) {
    const w = window.open("", "_blank");
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(a.path, 600);
    if (error || !data) { if (w) w.close(); toast(/not found/i.test((error && error.message) || "") ? "Súbor sa v úložisku nenašiel." : storageMsg(error)); return; }
    if (w) w.location.href = data.signedUrl; else location.href = data.signedUrl;
  }
  function cacheEvents() {
    if (!uid) return;
    try { localStorage.setItem("diar.cache." + uid, JSON.stringify([...state.events.values()])); } catch (e) {}
  }

  async function saveEvent(id, ev) {
    const data = clean(ev);
    if (!sb || !uid) {
      const nid = id || newId();
      state.events.set(nid, { id: nid, ...data }); saveLocal(); render(); return;
    }
    const nid = id || newId();
    const { error } = await sb.from("events").upsert(toRow(nid, { ...data, _hadWork: !!ev.hadWork }, !!ev.attTouched, !!ev.hadEnd));
    if (error) throw friendly(error);
    state.events.set(nid, { id: nid, ...data }); cacheEvents(); render();
  }
  async function removeEvent(id) {
    if (!sb || !uid) { state.events.delete(id); saveLocal(); render(); return; }
    const files = ((state.events.get(id) || {}).attachments || []).map(a => a.path);
    const { error } = await sb.from("events").delete().eq("id", id);
    if (error) throw friendly(error);
    removeFiles(files);
    state.events.delete(id); cacheEvents(); render();
  }
  function friendly(e) {
    const msg = (e && (e.message || "")) + "";
    if (/workplaces|'work' column/i.test(msg)) return "Databáza ešte nepozná pracovné miesta. V Supabase spusti súbor supabase-mzdy.sql (pozri README).";
    if (/end_date/i.test(msg)) return "Databáza ešte nepozná viacdňové akcie. V Supabase spusti súbor supabase-viacdnove.sql (pozri README).";
    if (/attachments/i.test(msg)) return "Databáza ešte nepozná prílohy. V Supabase spusti súbor supabase-prilohy.sql (pozri README).";
    if (e && e.code === "42501" || /row-level security/i.test(msg)) return "Databáza zápis odmietla. Skontroluj, či si spustil SQL z kroku 2 v návode.";
    if (e && e.code === "42P01" || /relation .* does not exist/i.test(msg)) return "V databáze chýba tabuľka. Spusti SQL z kroku 2 v návode.";
    if (/JWT|expired/i.test(msg)) return "Prihlásenie vypršalo. Obnov stránku a prihlás sa znova.";
    if (/fetch|network/i.test(msg)) return "Si offline. Zmenu sa nepodarilo uložiť, skús to po pripojení.";
    return "Nepodarilo sa uložiť: " + (msg || "neznáma chyba");
  }

  // ---------- Rendering ----------
  const viewEl = document.getElementById("view");
  const periodEl = document.getElementById("period");

  function card(ev, opts = {}) {
    const total = ev.checklist ? ev.checklist.length : 0;
    const doneN = total ? ev.checklist.filter(c => c.done).length : 0;
    const c = h("button", {
      class: "card", type: "button", dataset: { s: ev.status, id: ev.id },
      onclick: () => openEditor(ev.id),
    },
      opts.showDate ? null : h("span", { class: "t", text: dayLabel(ev, opts.day || ev.date) }),
      h("span", { class: "ttl", text: ev.title }),
      h("span", { class: "meta" },
        opts.showDate ? h("span", { class: "prog", text: rangeText(ev) }) : null,
        opts.pill !== false ? h("span", { class: "pill", dataset: { s: ev.status }, text: STATUS[ev.status] }) : null,
        total ? h("span", { class: "prog", text: "☑ " + doneN + "/" + total }) : null,
        ev.work ? h("span", { class: "wp-tag", text: ev.work.name + (payOf(ev) && payOf(ev).amount != null ? " · " + money(payOf(ev).amount) : "") }) : null,
        ev.notes ? h("span", { text: "poznámka" }) : null,
        ev.attachments && ev.attachments.length ? h("span", { class: "prog", text: "PDF " + ev.attachments.length }) : null,
        opts.move ? opts.move : null,
      ),
    );
    if (opts.showDate) { c.style.gridTemplateColumns = "1fr"; c.querySelector(".meta").style.gridColumn = "1"; }
    return c;
  }

  function renderMonth() {
    const c = state.cursor;
    periodEl.replaceChildren(MONTHS[c.getMonth()].replace(/^./, m => m.toUpperCase()) + " ", h("span", { text: c.getFullYear() }));
    const first = new Date(c.getFullYear(), c.getMonth(), 1);
    const start = mondayOf(first);
    const last = new Date(c.getFullYear(), c.getMonth() + 1, 0);
    const end = addDays(mondayOf(last), 6);
    const grid = h("div", { class: "month" });
    const t = todayIso();
    for (let d = start; d <= end; d = addDays(d, 1)) {
      const ds = iso(d);
      const evs = eventsOn(ds);
      const cls = ["cell"];
      if (d.getMonth() !== c.getMonth()) cls.push("out");
      if (ds === t) cls.push("today");
      if (ds === state.selected) cls.push("sel");
      const cell = h("div", {
        class: cls.join(" "), role: "button", tabindex: "0",
        "aria-label": fmtDay(ds) + ", akcií: " + evs.length,
        onclick: () => { state.selected = ds; render(); },
        onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); state.selected = ds; render(); } },
        ondblclick: () => openEditor(null, ds),
      }, h("span", { class: "num", text: d.getDate() }));
      evs.slice(0, 3).forEach(ev => cell.append(h("span", {
        class: "chip", dataset: { s: ev.status }, title: ev.title,
        onclick: e => { e.stopPropagation(); openEditor(ev.id); },
      }, chipLabel(ev, ds) ? h("b", { text: chipLabel(ev, ds) }) : null, ev.title)));
      if (evs.length > 3) cell.append(h("span", { class: "more", text: "+ ďalšie " + (evs.length - 3) }));
      if (evs.length) cell.append(h("span", { class: "dots" }, evs.slice(0, 6).map(ev => h("i", { dataset: { s: ev.status } }))));
      grid.append(cell);
    }
    const sel = state.selected;
    const selEvs = eventsOn(sel);
    const agenda = h("div", { class: "agenda" },
      h("div", { class: "agenda-head" },
        h("h2", { text: fmtDay(sel).replace(/^./, m => m.toUpperCase()) }),
        h("button", { class: "ghost", type: "button", onclick: () => openEditor(null, sel), text: "+ Pridať na tento deň" }),
      ),
      selEvs.length ? h("div", { class: "list" }, selEvs.map(ev => card(ev, { day: sel }))) :
        h("p", { class: "empty", text: "Na tento deň nemáš nič naplánované." }),
    );
    viewEl.replaceChildren(h("div", { class: "dow" }, DOW.map(x => h("div", { text: x }))), grid, agenda);
  }

  function renderWeek() {
    const mon = mondayOf(state.cursor);
    const sun = addDays(mon, 6);
    const sameMonth = mon.getMonth() === sun.getMonth();
    periodEl.replaceChildren(

  async function setStatus(id, s) {

  let signUpMode = false;
  function renderGate() {
    periodEl.replaceChildren();
    const err = h("p", { class: "err", id: "login-err", hidden: true });
    const info = h("p", { id: "login-info", hidden: true });
    const email = h("input", { id: "l-email", type: "email", autocomplete: "email", required: true, placeholder: "ty@example.sk" });
    const pass = h("input", { id: "l-pass", type: "password", autocomplete: signUpMode ? "new-password" : "current-password", required: true, minlength: "6" });
    const btn = h("button", { class: "primary", type: "submit", text: signUpMode ? "Vytvoriť účet" : "Prihlásiť sa" });
    const form = h("form", { class: "gate" },
      h("h2", { text: signUpMode ? "Nový účet" : "Prihlás sa" }),
      h("p", { text: "Akcie sa ukladajú do tvojej databázy. Uvidíš ich na každom zariadení, kde sa prihlásiš tým istým e-mailom." }),
      h("div", { class: "field" }, h("label", { for: "l-email", text: "E-mail" }), email),
      h("div", { class: "field" }, h("label", { for: "l-pass", text: signUpMode ? "Heslo (aspoň 6 znakov)" : "Heslo" }), pass),
      err, info, btn,
      h("button", { class: "ghost", type: "button", onclick: () => { signUpMode = !signUpMode; renderGate(); },
        text: signUpMode ? "Už mám účet, prihlásiť sa" : "Nemám účet, vytvoriť nový" }),
    );
    form.addEventListener("submit", async e => {
      e.preventDefault();
      err.hidden = true; info.hidden = true; btn.disabled = true;
      const creds = { email: email.value.trim(), password: pass.value };
      const res = signUpMode ? await sb.auth.signUp(creds) : await sb.auth.signInWithPassword(creds);
      btn.disabled = false;
      if (res.error) { err.textContent = loginMsg(res.error); err.hidden = false; return; }
      if (signUpMode && !res.data.session) {
        info.textContent = "Účet je vytvorený. Otvor e-mail od Supabase, potvrď adresu a potom sa tu prihlás.";
        info.hidden = false; signUpMode = false;
      }
    });
    viewEl.replaceChildren(form);
  }
  function loginMsg(e) {
    const m = (e.message || "") + "";
    if (/invalid login credentials/i.test(m)) return "Nesprávny e-mail alebo heslo.";
    if (/email not confirmed/i.test(m)) return "E-mail ešte nie je potvrdený. Klikni na odkaz v e-maile od Supabase.";
    if (/signups? not allowed|signup is disabled/i.test(m)) return "Registrácia nových účtov je vypnutá.";
    if (/already registered/i.test(m)) return "Tento e-mail už má účet. Prihlás sa.";
    if (/rate limit/i.test(m)) return "Príliš veľa pokusov. Skús to o chvíľu.";
    if (/password/i.test(m)) return "Heslo musí mať aspoň 6 znakov.";
    if (/fetch/i.test(m)) return "Nepodarilo sa spojiť so Supabase. Skontroluj pripojenie a adresu v nastavení.";
    return "Prihlásenie zlyhalo: " + m;
  }

  function render() {
    document.querySelectorAll(".bar .seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === state.view)));

  // ---------- Editor ----------
  function openEditor(id, dateStr) {
    if (readOnly) { toast("Tento diár môžeš len prezerať."); }
    const src = id ? state.events.get(id) : null;
    const draft = src ? JSON.parse(JSON.stringify(src)) : {
      title: "", date: dateStr || state.selected || todayIso(), time: "", end: "", status: "todo", notes: "", checklist: [],
    };
    draft.checklist = draft.checklist || [];
    draft.attachments = draft.attachments || [];
    const evId = id || newId();
    const pendingUploads = [];   // uploaded in this dialog; removed again if the dialog is cancelled
    const pendingRemovals = [];  // already saved files the person removed; deleted after saving
    let busyUploads = 0;
    const root = document.getElementById("modal-root");
    const err = h("p", { class: "err", hidden: true });

    const title = h("input", { id: "f-title", type: "text", value: draft.title, placeholder: "Napr. Zubár, Narodeniny mamy…", maxlength: "140" });
    const date = h("input", { id: "f-date", type: "date", value: draft.date });
    const time = h("input", { id: "f-time", type: "time", value: draft.time });
    const end = h("input", { id: "f-end", type: "time", value: draft.end, "aria-label": "Čas konca" });
    const endDate = h("input", { id: "f-enddate", type: "date", value: draft.endDate || draft.date, "aria-label": "Dátum konca" });
    date.setAttribute("aria-label", "Dátum začiatku"); time.setAttribute("aria-label", "Čas začiatku");
    draft.hadEnd = !!(src && src.endDate);
    draft.hadWork = !!(src && src.work);
    draft.work = draft.work ? { ...draft.work } : null;

    // work / pay
    const wpSel = h("select", { id: "f-wp", "aria-label": "Pracovné miesto" });
    function fillWp() {
      const opts = [h("option", { value: "", text: "— bez pracovného miesta —" })];
      activeWps().forEach(w => opts.push(h("option", { value: w.id, text: w.name })));
      if (draft.work && draft.work.wp && !activeWps().some(w => w.id === draft.work.wp))
        opts.push(h("option", { value: draft.work.wp, text: draft.work.name + " (archivované)" }));
      opts.push(h("option", { value: "__new", text: "+ Nové pracovné miesto…" }));
      wpSel.replaceChildren(...opts);
      wpSel.value = draft.work ? draft.work.wp || "" : "";
    }
    const payBox = h("div", { class: "pay-box" });
    const newWpBox = h("div", { class: "new-wp", hidden: true });
    const payType = h("select", { id: "f-paytype", "aria-label": "Druh sadzby" }, Object.keys(RATE).map(k => h("option", { value: k, text: RATE[k].label })));
    const payRate = h("input", { id: "f-payrate", type: "text", inputmode: "decimal", placeholder: "0,00", "aria-label": "Sadzba v eurách" });
    const payPer = h("span", { class: "per" });
    const payQty = h("input", { id: "f-payqty", type: "text", inputmode: "decimal", "aria-label": "Množstvo" });
    const payQtyLbl = h("label", { for: "f-payqty" });
    const payRateLbl = h("label", { for: "f-payrate", text: "Sadzba" });
    const payQtyField = h("div", { class: "field" }, payQtyLbl, payQty);
    const payOut = h("div", { class: "pay-out" });
    function currentEv() {
      return { date: date.value, endDate: endDate.value, time: time.value, end: end.value, work: draft.work };
    }
    function syncWorkFromInputs() {
      if (!draft.work) return;
      draft.work.type = payType.value;
      draft.work.rate = payRate.value.trim() === "" ? null : toNum(payRate.value);
      draft.work.qty = draft.work.type === "task" || payQty.value.trim() === "" ? null : toNum(payQty.value);
    }
    function drawPay() {
      payBox.hidden = !draft.work;
      if (!draft.work) return;
      syncWorkFromInputs();
      const ev = currentEv();
      const auto = autoQty(ev, draft.work.type);
      const task = draft.work.type === "task";
      payPer.textContent = RATE[draft.work.type].per;
      payRateLbl.textContent = task ? "Suma za túto úlohu" : "Sadzba";
      payRate.placeholder = task ? "zadaj sumu" : "0,00";
      payQtyField.hidden = task;
      payQtyLbl.textContent = RATE[draft.work.type].qtyLabel;
      payQty.placeholder = auto == null ? "zadaj" : num(auto) + " (z času)";
      const p = payOf(ev);
      let msg = null;
      if (p && p.rate == null) msg = task ? "Zadaj sumu za túto úlohu. Môžeš ju doplniť aj neskôr." : "Zadaj sadzbu. Môžeš ju doplniť aj neskôr.";
      else if (p && p.qty == null) msg = draft.work.type === "hour" ? "Zadaj čas od – do alebo počet hodín." : "Zadaj množstvo.";
      payOut.replaceChildren(msg ? h("span", { class: "hint", text: msg })
        : task ? h("span", {}, "Suma: ", h("strong", { text: money(p.amount) }))
        : h("span", {}, num(p.qty) + " " + p.unit + " × " + money(p.rate) + " = ", h("strong", { text: money(p.amount) })));
    }
    function loadPayInputs() {
      if (!draft.work) return;
      payType.value = draft.work.type;
      payRate.value = draft.work.rate == null ? "" : Number(draft.work.rate).toFixed(2).replace(".", ",");
      payQty.value = draft.work.qty == null ? "" : String(draft.work.qty).replace(".", ",");
    }
    function useWorkplace(w) {
      draft.work = { wp: w.id, name: w.name, type: w.rate_type, rate: Number(w.rate) > 0 ? Number(w.rate) : null, qty: null };
      loadPayInputs(); drawPay();
      if (draft.work.rate == null) setTimeout(() => payRate.focus(), 30);
    }
    wpSel.addEventListener("change", () => {
      if (wpSel.value === "__new") {
        newWpBox.hidden = false;
        newWpBox.replaceChildren(wpForm(null, row => {
          newWpBox.hidden = true; newWpBox.replaceChildren(); useWorkplace(row); fillWp(); toast("Pracovné miesto pridané");
        }, () => { newWpBox.hidden = true; newWpBox.replaceChildren(); fillWp(); }));
        return;
      }
      newWpBox.hidden = true; newWpBox.replaceChildren();
      if (!wpSel.value) { draft.work = null; drawPay(); return; }
      const w = state.workplaces.get(wpSel.value);
      if (w) useWorkplace(w);
    });
    [payType, payRate, payQty].forEach(el => el.addEventListener("input", drawPay));
    payType.addEventListener("change", drawPay);
    [date, endDate, time, end].forEach(el => el.addEventListener("change", drawPay));
    payBox.append(
      h("div", { class: "pay-grid" },
        h("div", { class: "field" }, h("label", { for: "f-paytype", text: "Druh sadzby" }), payType),
        h("div", { class: "field" }, payRateLbl, h("div", { class: "money-in" }, payRate, payPer)),
        payQtyField,
      ),
      payOut,
    );
    fillWp(); loadPayInputs(); drawPay();
    // keep the end on or after the start when the start date moves
    let lastStart = date.value;
    date.addEventListener("change", () => {
      if (!endDate.value || endDate.value === lastStart || endDate.value < date.value) endDate.value = date.value;
      lastStart = date.value;
    });
    const notes = h("textarea", { id: "f-notes", placeholder: "Adresa, čo si zobrať, kontakt…" });
    notes.value = draft.notes || "";

    const statusBox = h("div", { class: "status-pick", role: "group", "aria-label": "Stav" });
    function drawStatus() {
      statusBox.replaceChildren(...ORDER.map(s => h("button", {
        type: "button", dataset: { s }, "aria-pressed": String(draft.status === s),
        onclick: () => { draft.status = s; drawStatus(); }, text: STATUS[s],
      })));
    }
    drawStatus();

    const checks = h("div", { class: "checks" });
    function drawChecks() {
      checks.replaceChildren(...draft.checklist.map(item => {
        const cb = h("input", { type: "checkbox", id: "c-" + item.id, "aria-label": "Splnené" });
        cb.checked = !!item.done;
        const tx = h("input", { type: "text", id: "ct-" + item.id, value: item.text, "aria-label": "Položka" });
        const row = h("div", { class: "check" + (item.done ? " done" : "") }, cb, tx,
          h("button", { class: "x", type: "button", "aria-label": "Odstrániť položku", onclick: () => { draft.checklist = draft.checklist.filter(c => c !== item); drawChecks(); }, text: "×" }));
        cb.addEventListener("change", () => { item.done = cb.checked; row.classList.toggle("done", item.done); });
        tx.addEventListener("input", () => { item.text = tx.value; });
        return row;
      }));
    }
    drawChecks();
    const newCheck = h("input", { id: "f-newcheck", type: "text", placeholder: "Pridať položku a stlačiť Enter" });
    const addCheck = () => {
      const v = newCheck.value.trim(); if (!v) return;
      draft.checklist.push({ id: Math.random().toString(36).slice(2, 9), text: v, done: false });
      newCheck.value = ""; drawChecks(); newCheck.focus();
    };
    newCheck.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addCheck(); } });

    // attachments
    const canFiles = !!(sb && uid);
    const files = h("div", { class: "files" });
    const fileErr = h("p", { class: "err", hidden: true });
    const picker = h("input", { id: "f-files", type: "file", accept: "application/pdf,.pdf", multiple: true, hidden: true });
    const addFileBtn = h("button", { class: "ghost", type: "button", disabled: !canFiles, onclick: () => picker.click(), text: "+ Priložiť PDF" });
    const fileHint = h("span", { class: "hint", text: canFiles ? "Cenové ponuky, faktúry… max " + MAX_MB + " MB" : "Prílohy sa dajú pridávať po prihlásení." });
    function drawFiles() {
      files.replaceChildren(...draft.attachments.map(a => {
        const kind = h("select", { class: "kind", "aria-label": "Druh prílohy", dataset: { k: a.kind } },
          Object.keys(KINDS).map(k => h("option", { value: k, text: KINDS[k] })));
        kind.value = a.kind;
        kind.addEventListener("change", () => { a.kind = kind.value; kind.dataset.k = a.kind; draft.attTouched = true; });
        return h("div", { class: "file" }, kind,
          h("span", { class: "fname", title: a.name }, a.name, h("small", { text: fmtSize(a.size || 0) })),
          h("button", { class: "open", type: "button", onclick: () => openFile(a), text: "Otvoriť" }),
          h("button", { class: "x", type: "button", "aria-label": "Odstrániť prílohu " + a.name, onclick: () => {
            draft.attachments = draft.attachments.filter(x => x !== a); draft.attTouched = true;
            const i = pendingUploads.indexOf(a.path);
            if (i >= 0) { pendingUploads.splice(i, 1); removeFiles([a.path]); } else pendingRemovals.push(a.path);
            drawFiles();
          }, text: "×" }));
      }));
      if (!draft.attachments.length) files.append(h("p", { class: "empty", text: "Žiadne prílohy." }));
    }
    drawFiles();
    picker.addEventListener("change", async () => {
      const list = [...picker.files]; picker.value = "";
      if (!list.length) return;
      fileErr.hidden = true; busyUploads++;
      addFileBtn.disabled = true; saveBtn.disabled = true;
      for (const f of list) {
        addFileBtn.textContent = "Nahrávam " + f.name + "…";
        try {
          const a = await uploadPdf(evId, f);
          pendingUploads.push(a.path); draft.attachments.push(a); draft.attTouched = true; drawFiles();
        } catch (msg) { fileErr.textContent = msg; fileErr.hidden = false; }
      }
      busyUploads--;
      addFileBtn.textContent = "+ Priložiť PDF"; addFileBtn.disabled = false; saveBtn.disabled = false;
    });

    const saveBtn = h("button", { class: "primary", type: "submit", text: src ? "Uložiť zmeny" : "Pridať akciu" });
    let armed = false;
    const delBtn = src ? h("button", { class: "danger", type: "button", text: "Vymazať", onclick: async () => {
      if (!armed) { armed = true; delBtn.classList.add("armed"); delBtn.textContent = "Naozaj vymazať?"; return; }
      try { await removeEvent(id); removeFiles(pendingUploads.splice(0)); close(true); toast("Akcia vymazaná"); } catch (msg) { err.textContent = msg; err.hidden = false; }
    } }) : null;

    const form = h("form", { class: "modal", role: "dialog", "aria-modal": "true", "aria-labelledby": "m-title" },
      h("h2", { id: "m-title", text: src ? "Upraviť akciu" : "Nová akcia" }),
      h("div", { class: "field" }, h("label", { for: "f-title", text: "Názov" }), title),
      h("div", { class: "field" }, h("label", { for: "f-wp", text: "Pracovné miesto" }), wpSel, newWpBox, payBox),
      h("div", { class: "when" },
        h("div", { class: "field" }, h("label", { for: "f-date", text: "Začiatok" }), h("div", { class: "pair" }, date, time)),
        h("div", { class: "field" }, h("label", { for: "f-enddate", text: "Koniec" }), h("div", { class: "pair" }, endDate, end)),
        h("p", { class: "hint", text: "Bez času je akcia celodenná. Viacdňová akcia: zmeň dátum konca." }),
      ),
      h("div", { class: "field" }, h("span", { class: "lbl", text: "Stav" }), statusBox),
      h("div", { class: "field" }, h("label", { for: "f-notes", text: "Poznámky" }), notes),
      h("div", { class: "field" }, h("span", { class: "lbl", text: "Checklist" }), checks,
        h("div", { class: "add-check" }, newCheck, h("button", { class: "ghost", type: "button", onclick: addCheck, text: "Pridať" }))),
      h("div", { class: "field" }, h("span", { class: "lbl", text: "Prílohy (PDF)" }), files,
        h("div", { class: "file-add" }, addFileBtn, fileHint, picker), fileErr),
      err,
      h("div", { class: "modal-foot" }, delBtn, h("span", { class: "spacer" }),
        h("button", { class: "ghost", type: "button", onclick: () => close(), text: "Zrušiť" }), saveBtn),
    );
    form.addEventListener("submit", async e => {
      e.preventDefault();
      draft.title = title.value.trim(); draft.date = date.value; draft.time = time.value; draft.end = end.value; draft.notes = notes.value;
      const endD = endDate.value || draft.date;
      if (newCheck.value.trim()) addCheck();
      if (!draft.title) { err.textContent = "Zadaj názov akcie."; err.hidden = false; title.focus(); return; }
      if (!draft.date) { err.textContent = "Vyber dátum."; err.hidden = false; return; }
      if (endD < draft.date) { err.textContent = "Koniec nemôže byť skôr ako začiatok."; err.hidden = false; endDate.focus(); return; }
      if (draft.end && !draft.time) { err.textContent = "Zadaj aj čas začiatku, alebo vymaž čas konca."; err.hidden = false; time.focus(); return; }
      if (endD === draft.date && draft.time && draft.end && draft.end <= draft.time) {
        err.textContent = "Koniec musí byť neskôr ako začiatok. Ak akcia končí na druhý deň, zmeň dátum konca."; err.hidden = false; end.focus(); return;
      }
      draft.endDate = endD === draft.date ? "" : endD;
      syncWorkFromInputs();
      if (draft.work && payRate.value.trim() !== "" && (toNum(payRate.value) === null || toNum(payRate.value) < 0)) { err.textContent = "Sumu zadaj ako číslo, napr. 12,50, alebo ju nechaj prázdnu."; err.hidden = false; payRate.focus(); return; }
      if (draft.work && payQty.value.trim() !== "" && (toNum(payQty.value) === null || toNum(payQty.value) < 0)) { err.textContent = "Množstvo zadaj ako číslo, napr. 7,5."; err.hidden = false; payQty.focus(); return; }
      if (busyUploads) { err.textContent = "Počkaj, kým sa dokončí nahrávanie príloh."; err.hidden = false; return; }
      saveBtn.disabled = true; saveBtn.textContent = "Ukladám…";
      try {
        await saveEvent(evId, draft);
        pendingUploads.length = 0;
        removeFiles(pendingRemovals.splice(0));
        state.selected = draft.date;
        const d = parse(draft.date);
        if (state.view === "month" && (d.getMonth() !== state.cursor.getMonth() || d.getFullYear() !== state.cursor.getFullYear())) state.cursor = d;
        close(true); toast(src ? "Uložené" : "Akcia pridaná");
      } catch (msg) {
        err.textContent = msg; err.hidden = false; saveBtn.disabled = false; saveBtn.textContent = src ? "Uložiť zmeny" : "Pridať akciu";
      }
    });

    const overlay = h("div", { class: "overlay", onclick: e => { if (e.target === overlay) close(); } }, form);
    function onKey(e) { if (e.key === "Escape") close(); }
    function close(saved) {
      if (!saved && busyUploads) { err.textContent = "Počkaj, kým sa dokončí nahrávanie príloh."; err.hidden = false; return; }
      if (!saved && pendingUploads.length) removeFiles(pendingUploads.splice(0));  // cancelled: drop files uploaded in this dialog
      document.removeEventListener("keydown", onKey); root.replaceChildren(); render();
    }
    document.addEventListener("keydown", onKey);
    root.replaceChildren(overlay);
    if (!src) setTimeout(() => title.focus(), 30);
  }

  // ---------- Apple Calendar subscription ----------
  function openFeed() {
    const root = document.getElementById("modal-root");
    const body = h("div", { class: "feed-body" }, h("p", { class: "empty", text: "Pripravujem adresu…" }));
    const err = h("p", { class: "err", hidden: true });
    const modal = h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-labelledby": "feed-title" },
      h("h2", { id: "feed-title", text: "Kalendár na iPhone a Macu" }),
      h("p", { class: "feed-lead", text: "Akcie z diára sa zobrazia v aplikácii Kalendár ako samostatný kalendár „Osobný diár“. Nové, upravené aj vymazané akcie sa prejavia samy, zvyčajne do 15 – 60 minút. Upravuješ ich tu v diári." }),
      body, err,
      h("div", { class: "modal-foot" }, h("span", { class: "spacer" }), h("button", { class: "ghost", type: "button", onclick: () => close(), text: "Zavrieť" })),
    );
    const overlay = h("div", { class: "overlay", onclick: e => { if (e.target === overlay) close(); } }, modal);
    function onKey(e) { if (e.key === "Escape") close(); }
    function close() { document.removeEventListener("keydown", onKey); root.replaceChildren(); render(); }
    document.addEventListener("keydown", onKey);
    root.replaceChildren(overlay);

    function feedErr(e) {
      const m = ((e && e.message) || "") + "";
      if (/calendar_feeds|relation|does not exist|schema cache/i.test(m)) return "V databáze ešte chýba tabuľka pre kalendár. V Supabase spusti súbor supabase-kalendar.sql (pozri README).";
      if (/fetch|network/i.test(m)) return "Si offline. Adresu kalendára sa nepodarilo načítať.";
      return "Adresu sa nepodarilo pripraviť: " + (m || "neznáma chyba");
    }
    async function getToken() {
      const got = await sb.from("calendar_feeds").select("token").eq("user_id", uid).maybeSingle();
      if (got.error) throw got.error;
      if (got.data) return got.data.token;
      const ins = await sb.from("calendar_feeds").insert({}).select("token").single();
      if (ins.error) throw ins.error;
      return ins.data.token;
    }
    async function show() {
      err.hidden = true;
      try { draw(await getToken()); }
      catch (e) { body.replaceChildren(); err.textContent = feedErr(e); err.hidden = false; }
    }
    function draw(token) {
      const https = SUPABASE_URL + "/functions/v1/" + FEED_FUNCTION + "?t=" + token;
      const webcal = https.replace(/^https:/, "webcal:");
      const input = h("input", { id: "feed-url", type: "text", readonly: true, value: https, "aria-label": "Adresa kalendára" });
      input.addEventListener("focus", () => input.select());
      const copy = h("button", { class: "ghost", type: "button", text: "Kopírovať", onclick: async () => {
        try { await navigator.clipboard.writeText(https); toast("Adresa skopírovaná"); }
        catch (e) { input.focus(); input.select(); toast("Adresa je označená, skopíruj ju."); }
      } });
      let armed = false;
      const regen = h("button", { class: "danger", type: "button", text: "Vytvoriť novú adresu", onclick: async () => {
        if (!armed) { armed = true; regen.classList.add("armed"); regen.textContent = "Stará adresa prestane fungovať. Pokračovať?"; return; }
        regen.disabled = true;
        const d = await sb.from("calendar_feeds").delete().eq("user_id", uid);
        if (d.error) { err.textContent = feedErr(d.error); err.hidden = false; regen.disabled = false; return; }
        await show(); toast("Vytvorená nová adresa. V Kalendári odstráň starú a pridaj túto.");
      } });
      body.replaceChildren(
        h("a", { class: "primary feed-add", href: webcal, text: "Pridať do Kalendára" }),
        h("p", { class: "hint", text: "Na iPhone, iPade a Macu otvorí Kalendár s ponukou na odoberanie. Ak sa nič nestane, pridaj adresu ručne:" }),
        h("div", { class: "field" }, h("label", { for: "feed-url", text: "Adresa kalendára" }), h("div", { class: "add-check" }, input, copy)),
        h("ol", { class: "steps" },
          h("li", {}, h("b", { text: "Mac (odporúčané): " }), "Kalendár → Súbor → Nový odoberaný kalendár → vlož adresu. V ďalšom okne nastav Umiestnenie: iCloud a Obnovovať: každých 15 minút. Potom sa objaví sám aj na iPhone a iPade."),
          h("li", {}, h("b", { text: "iPhone / iPad: " }), "Nastavenia → Aplikácie → Kalendár → Účty kalendárov → Pridať účet → Iné → Pridať odoberaný kalendár → vlož adresu."),
        ),
        h("p", { class: "hint" }, "Adresu nikomu neposielaj, kto ju má, vidí tvoje akcie. ",
          h("a", { href: https, target: "_blank", rel: "noopener", text: "Vyskúšať adresu" })),
        h("div", { class: "modal-foot" }, regen),
      );
    }
    show();
  }

  // ---------- Controls ----------
  document.querySelectorAll(".bar .seg button").forEach(b => b.addEventListener("click", () => {
    state.view = b.dataset.v;
    try { localStorage.setItem("diar.view", state.view); } catch (e) {}
    render();
  }));
  document.getElementById("new-btn").addEventListener("click", () => openEditor(null));
  document.getElementById("prev").addEventListener("click", () => step(-1));
  document.getElementById("next").addEventListener("click", () => step(1));
  document.getElementById("today-btn").addEventListener("click", () => { state.cursor = new Date(); state.selected = todayIso(); render(); });
  function step(dir) {
    const c = state.cursor;
    if (state.view === "week") state.cursor = addDays(c, 7 * dir);
    else state.cursor = new Date(c.getFullYear(), c.getMonth() + dir, 1);
  if (state.view === "week") state.selected = iso(mondayOf(state.cursor));
    render();
  }

  render();

  // ---------- Connect store ----------
  const syncEl = document.getElementById("sync");
  const notice = document.getElementById("notice");
  function offline(msg) {
    syncEl.textContent = "neuložené";
    notice.textContent = msg; notice.hidden = false;
  }
  const authBtn = document.getElementById("auth-btn");
  const calBtn = document.getElementById("cal-btn");
  calBtn.addEventListener("click", () => openFeed());
  const modalOpen = () => document.getElementById("modal-root").children.length > 0;

  const configured = /^https:\/\//.test(SUPABASE_URL) && SUPABASE_KEY && !SUPABASE_KEY.startsWith("VLOZ");
  if (!configured || !window.supabase) {
    // Local mode: works right away, but only in this browser
    localMode = true;
    try {
      const saved = JSON.parse(localStorage.getItem("diar.events") || "[]");
      saved.forEach(e => { if (e && e.id && e.title) state.events.set(e.id, e); });
      JSON.parse(localStorage.getItem("diar.workplaces") || "[]").forEach(w => { if (w && w.id) state.workplaces.set(w.id, w); });
    } catch (e) {}
    syncEl.textContent = "len toto zariadenie";
    notice.textContent = !window.supabase && configured
      ? "Nepodarilo sa načítať Supabase (si offline?). Diár teraz ukladá len do tohto prehliadača."
      : "Diár zatiaľ ukladá len do tohto prehliadača. Aby sa akcie synchronizovali medzi zariadeniami, nastav Supabase podľa návodu (NAVOD.md).";
    notice.hidden = false;
    render();
    return;
  }

  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });
  syncEl.textContent = "pripájam…";

  authBtn.addEventListener("click", async () => {
    if (authBtn.dataset.armed) { delete authBtn.dataset.armed; authBtn.textContent = "Odhlásiť"; await sb.auth.signOut(); return; }
    authBtn.dataset.armed = "1"; authBtn.textContent = "Naozaj odhlásiť?";
    setTimeout(() => { delete authBtn.dataset.armed; authBtn.textContent = "Odhlásiť"; }, 3000);
  });

  let channel = null;
  let loadTimer = null;
  async function loadAll() {
    if (!uid) return;
    const { data, error } = await sb.from("events").select("*").order("event_date").limit(5000);
    if (error) {
      syncEl.textContent = "offline";
      if (!/fetch/i.test(error.message || "")) offline(friendly(error));
      return;
    }
    notice.hidden = true;
    state.events = new Map(data.map(r => [r.id, fromRow(r)]));
    cacheEvents();
    const wps = await sb.from("workplaces").select("*").order("name");
    if (wps.error) wpMissing = /workplaces|relation|schema cache/i.test(wps.error.message || "");
    else { wpMissing = false; state.workplaces = new Map(wps.data.map(w => [w.id, w])); }
    try { localStorage.setItem("diar.wpcache." + uid, JSON.stringify(wps.data || [])); } catch (e) {}
    syncEl.textContent = "synchronizované";
    if (!modalOpen()) render();
  }
  const scheduleLoad = () => { clearTimeout(loadTimer); loadTimer = setTimeout(loadAll, 250); };

  function startSession(user) {
    if (user && user.id === uid) return;          // token refresh, same person
    if (channel) { sb.removeChannel(channel); channel = null; }
    uid = user ? user.id : null;
    notice.hidden = true;
    if (!uid) {
      state.events = new Map(); state.gate = true;
      authBtn.hidden = true; calBtn.hidden = true; syncEl.textContent = "neprihlásený";
      render(); return;
    }
    state.gate = false;
    authBtn.hidden = false; calBtn.hidden = false; authBtn.title = user.email || "";
    // show the last known events right away, then refresh from the database
    try {
      const cached = JSON.parse(localStorage.getItem("diar.cache." + uid) || "[]");
      state.events = new Map(cached.filter(e => e && e.id).map(e => [e.id, e]));
      const wc = JSON.parse(localStorage.getItem("diar.wpcache." + uid) || "[]");
      state.workplaces = new Map(wc.filter(w => w && w.id).map(w => [w.id, w]));
    } catch (e) { state.events = new Map(); }
    render();
    loadAll();
    channel = sb.channel("events-" + uid)
      .on("postgres_changes", { event: "*", schema: "public", table: "events", filter: "user_id=eq." + uid }, scheduleLoad)
      .on("postgres_changes", { event: "*", schema: "public", table: "workplaces", filter: "user_id=eq." + uid }, scheduleLoad)
      .subscribe();
  }

  sb.auth.onAuthStateChange((event, session) => {
    // defer: Supabase recommends not awaiting other calls inside this callback
    setTimeout(() => startSession(session ? session.user : null), 0);
  });

  // pick up changes made on other devices when the app comes back to the foreground
  document.addEventListener("visibilitychange", () => { if (!document.hidden) scheduleLoad(); });
  window.addEventListener("online", scheduleLoad);
})();
</script>
</body>
</html>
